name: threatwatch_ai
description: Flutter cybersecurity dashboard with KEV feed, URL/QR scanner, quick checks, AI coach, and history.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.4
  fl_chart: ^1.2.0
  mobile_scanner: ^7.2.0
  image_picker: ^1.2.1
  google_mlkit_face_detection: ^0.13.2
  tflite_flutter: ^0.11.0
  image: ^4.5.4
  exif: ^3.3.0
  native_exif: ^0.7.0
  geocoding: ^4.0.0
  camera: ^0.11.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
